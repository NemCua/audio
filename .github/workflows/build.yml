name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          $resourceDir = "electron\resources\python"
          $runtimeDir = "$resourceDir\python_runtime"
          New-Item -ItemType Directory -Force $runtimeDir | Out-Null
          $pyUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          $pyZip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri $pyUrl -OutFile $pyZip
          Expand-Archive $pyZip -DestinationPath $runtimeDir -Force
          New-Item -ItemType Directory -Force "$runtimeDir\Lib\site-packages" | Out-Null
          $pth = Join-Path $runtimeDir "python311._pth"
          @(
            "python311.zip",
            ".",
            "..",
            "Lib\site-packages",
            "import site"
          ) | Set-Content $pth -Encoding ASCII
          pip install -r requirements.txt --target "$runtimeDir\Lib\site-packages"

      - name: Install FFmpeg
        run: |
          $ffmpegZip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $ffmpegDir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile $ffmpegZip
          Expand-Archive $ffmpegZip -DestinationPath $ffmpegDir -Force
          $binDir = Get-ChildItem $ffmpegDir -Recurse -Directory -Filter bin | Select-Object -First 1
          if (-not $binDir) { throw "Cannot find FFmpeg bin directory" }
          "FFMPEG_BIN_DIR=$($binDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Electron resources
        env:
          BEEKNOEE_API_KEY: ${{ secrets.BEEKNOEE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CAPCUT_DEVICE_ID: ${{ secrets.CAPCUT_DEVICE_ID }}
          CAPCUT_IID: ${{ secrets.CAPCUT_IID }}
        run: |
          $resourceDir = "electron\resources\python"
          New-Item -ItemType Directory -Force $resourceDir | Out-Null
          Copy-Item translate_server.py "$resourceDir\translate_server.py" -Force
          Copy-Item translate_video.py "$resourceDir\translate_video.py" -Force
          Copy-Item requirements.txt "$resourceDir\requirements.txt" -Force
          Copy-Item "$env:FFMPEG_BIN_DIR\ffmpeg.exe" "$resourceDir\ffmpeg.exe" -Force
          Copy-Item "$env:FFMPEG_BIN_DIR\ffprobe.exe" "$resourceDir\ffprobe.exe" -Force
          Copy-Item "$env:FFMPEG_BIN_DIR\*.dll" $resourceDir -Force -ErrorAction SilentlyContinue
          Copy-Item static_translate "$resourceDir\static_translate" -Recurse -Force
          Copy-Item capcut-tts-api-main "$resourceDir\capcut-tts-api-main" -Recurse -Force
          if (Test-Path voice_previews) {
            Copy-Item voice_previews "$resourceDir\voice_previews" -Recurse -Force
          }

          $envLines = @(
            "FFMPEG_BIN=ffmpeg.exe",
            "FFPROBE_BIN=ffprobe.exe"
          )
          if ($env:BEEKNOEE_API_KEY) { $envLines += "BEEKNOEE_API_KEY=$env:BEEKNOEE_API_KEY" }
          if ($env:GROQ_API_KEY) { $envLines += "GROQ_API_KEY=$env:GROQ_API_KEY" }
          if ($env:CAPCUT_DEVICE_ID) { $envLines += "CAPCUT_DEVICE_ID=$env:CAPCUT_DEVICE_ID" }
          if ($env:CAPCUT_IID) { $envLines += "CAPCUT_IID=$env:CAPCUT_IID" }
          $envLines | Set-Content "$resourceDir\.env" -Encoding UTF8

      - name: Create local debug launcher
        run: |
          $batContent = "@echo off`ncd /d `"%~dp0`"`nset FFMPEG_BIN=%~dp0ffmpeg.exe`nset FFPROBE_BIN=%~dp0ffprobe.exe`nset PYTHONPATH=%~dp0`npython_runtime\python.exe translate_server.py`npause"
          $batContent | Set-Content -Path "electron\resources\python\run_server.bat" -Encoding ASCII

      - name: Smoke test bundled Python server
        run: |
          $resourceDir = Resolve-Path "electron\resources\python"
          $logOut = Join-Path $env:RUNNER_TEMP "translate_server.out.log"
          $logErr = Join-Path $env:RUNNER_TEMP "translate_server.err.log"
          $env:FFMPEG_BIN = Join-Path $resourceDir "ffmpeg.exe"
          $env:FFPROBE_BIN = Join-Path $resourceDir "ffprobe.exe"
          $env:PYTHONPATH = $resourceDir
          $testVideo = Join-Path $env:RUNNER_TEMP "ffmpeg-test.mp4"
          $testAudio = Join-Path $env:RUNNER_TEMP "ffmpeg-test.mp3"
          & $env:FFMPEG_BIN -y -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=1000:sample_rate=44100 -t 1 -c:v libx264 -preset ultrafast -c:a aac $testVideo
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to create test video" }
          & $env:FFMPEG_BIN -y -i $testVideo -vn -acodec libmp3lame -ac 1 -ar 16000 -b:a 32k $testAudio
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $testAudio)) { throw "Bundled FFmpeg failed STT audio extraction test" }
          $proc = Start-Process -FilePath (Join-Path $resourceDir "python_runtime\python.exe") `
            -ArgumentList (Join-Path $resourceDir "translate_server.py") `
            -WorkingDirectory $resourceDir `
            -PassThru `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              if ($proc.HasExited) {
                throw "translate_server.py exited with code $($proc.ExitCode)"
              }
              try {
                $root = Invoke-WebRequest "http://127.0.0.1:8005/" -UseBasicParsing -TimeoutSec 2
                if ($root.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "translate_server.py did not become ready in 180 seconds"
            }
            $voices = Invoke-RestMethod "http://127.0.0.1:8005/api/voices" -TimeoutSec 10
            if (-not $voices.voices -or $voices.voices.Count -lt 5) {
              throw "Voice list is missing or too small"
            }
            Invoke-WebRequest "http://127.0.0.1:8005/voice_previews/vi_female_huong.mp3" -UseBasicParsing -TimeoutSec 10 | Out-Null
            Invoke-RestMethod "http://127.0.0.1:8005/api/app-settings" -TimeoutSec 10 | Out-Null
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            Write-Host "--- server stdout ---"
            if (Test-Path $logOut) { Get-Content $logOut -Tail 200 }
            Write-Host "--- server stderr ---"
            if (Test-Path $logErr) { Get-Content $logErr -Tail 200 }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: |
          if (Test-Path package-lock.json) {
            npm ci --ignore-scripts
          } else {
            npm install --ignore-scripts
          }

      - name: Set version from git tag
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -match '^\d+\.\d+\.\d+') {
            $pkg = Get-Content electron/package.json | ConvertFrom-Json
            $pkg.version = $version
            $pkg | ConvertTo-Json -Depth 10 | Set-Content electron/package.json -Encoding UTF8
            Write-Host "Version set to $version"
          }

      - name: Build Electron app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_DRAFT: false
          EP_PRE_RELEASE: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DichVideo-Windows
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml

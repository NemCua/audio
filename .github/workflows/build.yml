name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv electron\resources\python\python_env
          electron\resources\python\python_env\Scripts\python.exe -m pip install --upgrade pip
          electron\resources\python\python_env\Scripts\pip.exe install -r requirements.txt

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress

      - name: Prepare Electron resources
        env:
          BEEKNOEE_API_KEY: ${{ secrets.BEEKNOEE_API_KEY }}
          CAPCUT_DEVICE_ID: ${{ secrets.CAPCUT_DEVICE_ID }}
          CAPCUT_IID: ${{ secrets.CAPCUT_IID }}
        run: |
          $resourceDir = "electron\resources\python"
          New-Item -ItemType Directory -Force $resourceDir | Out-Null
          Copy-Item translate_server.py "$resourceDir\translate_server.py" -Force
          Copy-Item translate_video.py "$resourceDir\translate_video.py" -Force
          Copy-Item requirements.txt "$resourceDir\requirements.txt" -Force
          Copy-Item (Get-Command ffmpeg.exe).Source "$resourceDir\ffmpeg.exe" -Force
          Copy-Item (Get-Command ffprobe.exe).Source "$resourceDir\ffprobe.exe" -Force
          Copy-Item static_translate "$resourceDir\static_translate" -Recurse -Force
          Copy-Item capcut-tts-api-main "$resourceDir\capcut-tts-api-main" -Recurse -Force
          if (Test-Path voice_previews) {
            Copy-Item voice_previews "$resourceDir\voice_previews" -Recurse -Force
          }

          $envLines = @(
            "FFMPEG_BIN=ffmpeg.exe",
            "FFPROBE_BIN=ffprobe.exe"
          )
          if ($env:BEEKNOEE_API_KEY) { $envLines += "BEEKNOEE_API_KEY=$env:BEEKNOEE_API_KEY" }
          if ($env:CAPCUT_DEVICE_ID) { $envLines += "CAPCUT_DEVICE_ID=$env:CAPCUT_DEVICE_ID" }
          if ($env:CAPCUT_IID) { $envLines += "CAPCUT_IID=$env:CAPCUT_IID" }
          $envLines | Set-Content "$resourceDir\.env" -Encoding UTF8

      - name: Create local debug launcher
        run: |
          $batContent = "@echo off`ncd /d `"%~dp0`"`nset FFMPEG_BIN=%~dp0ffmpeg.exe`nset FFPROBE_BIN=%~dp0ffprobe.exe`npython_env\Scripts\python.exe translate_server.py`npause"
          $batContent | Set-Content -Path "electron\resources\python\run_server.bat" -Encoding ASCII

      - name: Smoke test bundled Python server
        run: |
          $resourceDir = Resolve-Path "electron\resources\python"
          $logOut = Join-Path $env:RUNNER_TEMP "translate_server.out.log"
          $logErr = Join-Path $env:RUNNER_TEMP "translate_server.err.log"
          $env:FFMPEG_BIN = Join-Path $resourceDir "ffmpeg.exe"
          $env:FFPROBE_BIN = Join-Path $resourceDir "ffprobe.exe"
          $proc = Start-Process -FilePath (Join-Path $resourceDir "python_env\Scripts\python.exe") `
            -ArgumentList (Join-Path $resourceDir "translate_server.py") `
            -WorkingDirectory $resourceDir `
            -PassThru `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              if ($proc.HasExited) {
                throw "translate_server.py exited with code $($proc.ExitCode)"
              }
              try {
                $root = Invoke-WebRequest "http://127.0.0.1:8005/" -UseBasicParsing -TimeoutSec 2
                if ($root.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "translate_server.py did not become ready in 180 seconds"
            }
            $voices = Invoke-RestMethod "http://127.0.0.1:8005/api/voices" -TimeoutSec 10
            if (-not $voices.voices -or $voices.voices.Count -lt 5) {
              throw "Voice list is missing or too small"
            }
            Invoke-WebRequest "http://127.0.0.1:8005/voice_previews/vi_female_huong.mp3" -UseBasicParsing -TimeoutSec 10 | Out-Null
            Invoke-RestMethod "http://127.0.0.1:8005/api/app-settings" -TimeoutSec 10 | Out-Null
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            Write-Host "--- server stdout ---"
            if (Test-Path $logOut) { Get-Content $logOut -Tail 200 }
            Write-Host "--- server stderr ---"
            if (Test-Path $logErr) { Get-Content $logErr -Tail 200 }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: |
          if (Test-Path package-lock.json) {
            npm ci --ignore-scripts
          } else {
            npm install --ignore-scripts
          }

      - name: Set version from git tag
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -match '^\d+\.\d+\.\d+') {
            $pkg = Get-Content electron/package.json | ConvertFrom-Json
            $pkg.version = $version
            $pkg | ConvertTo-Json -Depth 10 | Set-Content electron/package.json -Encoding UTF8
            Write-Host "Version set to $version"
          }

      - name: Build Electron app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_DRAFT: false
          EP_PRE_RELEASE: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DichVideo-Windows
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml
          retention-days: 30

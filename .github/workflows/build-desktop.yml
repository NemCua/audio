name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [threads_all_browser]
    tags: ["desktop-v*"]
    paths:
      - "electron/**"
      - "threads/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: npm run build:mac -- --arm64
            artifact: macos-arm64
            files: |
              electron/dist/*.dmg
              electron/dist/*.zip
          - os: macos-15-intel
            command: npm run build:mac -- --x64
            artifact: macos-x64
            files: |
              electron/dist/*.dmg
              electron/dist/*.zip
          - os: windows-2025
            command: npm run build:win -- --x64
            artifact: windows-x64
            files: electron/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: threads-video-maker-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: threads-video-maker-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Threads Video Maker v1.1.1 — Built-in media fix
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe

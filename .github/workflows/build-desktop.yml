name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [threads_all_browser]
    tags: ["desktop-v*"]
    paths:
      - "electron/**"
      - "threads/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  prepare-public-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
      DOWNLOADS_REPO: NemCua/threads-video-maker-downloads
    steps:
      - name: Create public release for tagged builds
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: gh release view "${{ github.ref_name }}" --repo "$DOWNLOADS_REPO" || gh release create "${{ github.ref_name }}" --repo "$DOWNLOADS_REPO" --title "Threads Video Maker ${{ github.ref_name }}" --notes "Official installers for Threads Video Maker ${{ github.ref_name }}."

  build:
    needs: prepare-public-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: npm run build:mac -- --arm64
            artifact: macos-arm64
            files: |
              electron/dist/*.dmg
              electron/dist/*.zip
            release_files: dist/*.dmg dist/*.zip
          - os: macos-15-intel
            command: npm run build:mac -- --x64
            artifact: macos-x64
            files: |
              electron/dist/*.dmg
              electron/dist/*.zip
            release_files: dist/*.dmg dist/*.zip
          - os: windows-2025
            command: npm run build:win -- --x64
            artifact: windows-x64
            files: electron/dist/*.exe
            release_files: dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installers to public downloads release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: NemCua/threads-video-maker-downloads
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.release_files }} --repo "$DOWNLOADS_REPO" --clobber

      - name: Keep CI artifacts for non-release builds
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: threads-video-maker-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

name: Release Windows desktop patch

on:
  push:
    tags: ["desktop-win-v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run build:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: threads-video-maker-windows-x64
          path: electron/dist/*.exe
          if-no-files-found: error

  release-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: threads-video-maker-windows-x64
          path: release-assets
      - name: Publish Windows-only GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Threads Video Maker Windows ${{ github.ref_name }}
          body: |
            Bản vá riêng cho Windows: sửa video xuất bị bẹp, mờ và xuất hiện scrollbar do DPI/viewport của renderer ẩn.

            Chỉ gồm bộ cài Setup và bản Portable Windows x64. macOS không được build lại trong release này.
          files: release-assets/*.exe

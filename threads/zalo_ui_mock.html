<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Zalo Chat UI Mock</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --zalo:#0b98f6;
      --zalo-2:#04a8ec;
      --chat-bg:#e7eef6;
      --text:#111827;
      --muted:#7b8794;
      --pink:#ef4b87;
    }
    html,body{height:100%;margin:0}
    body{
      display:grid;place-items:center;background:#101522;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
    }
    .phone{
      width:min(100vw,460px);height:min(100vh,920px);min-height:640px;
      display:flex;flex-direction:column;overflow:hidden;background:var(--chat-bg);
      box-shadow:0 24px 80px #0008;
    }
    .header{
      flex:0 0 auto;height:94px;padding:19px 16px 14px;
      display:flex;align-items:center;gap:14px;color:#fff;
      background:linear-gradient(110deg,var(--zalo),var(--zalo-2));
    }
    .back{font-size:42px;font-weight:200;line-height:1;transform:translateY(-2px)}
    .heading{min-width:0;flex:1}
    .title{font-size:21px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .members{font-size:14px;margin-top:3px;color:#e5f5ff}
    .actions{display:flex;align-items:center;gap:19px}
    .icon{width:32px;height:32px;display:block;object-fit:contain}
    .icon-video{width:38px}
    .icon-menu{width:35px}
    .chat{
      flex:1;overflow:hidden;padding:22px 15px 34px;
      display:flex;flex-direction:column;justify-content:flex-end;gap:13px;
      background:
        radial-gradient(circle at 14% 14%,#fff5 0 1px,transparent 2px),
        linear-gradient(#e7eef6,#e2eaf3);
      background-size:26px 26px,auto;
    }
    .row{display:flex;align-items:flex-start;gap:8px;max-width:92%}
    .row.mine{align-self:flex-end;flex-direction:row-reverse}
    .avatar{
      width:30px;height:30px;flex:0 0 30px;border-radius:50%;overflow:hidden;
      border:1px solid #ffffffcc;background:#9dc4dc;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .message{min-width:0}
    .bubble{
      position:relative;background:#fff;border:1px solid var(--zalo);
      border-radius:13px;padding:13px 14px;font-size:18px;line-height:1.32;
      box-shadow:0 1px 1px #8193a51c;
    }
    .mine .bubble{background:#d9f2ff;border-color:#87cef7}
    .sender{font-size:14px;color:var(--pink);margin-bottom:6px;font-weight:550}
    .mention{color:#0797f4;font-weight:600}
    .reply{
      margin:11px -14px -13px;padding:10px 14px;text-align:center;
      border-top:1px solid #d8dde4;color:var(--zalo);font-size:16px;font-weight:600;
    }
    .image-bubble{padding:0;overflow:hidden;background:#fff}
    .image-bubble img{display:block;width:100%;max-height:210px;object-fit:cover}
    .schedule{
      width:100%;aspect-ratio:2.8/1;padding:12px 10px;background:#f8fafc;
      display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
    }
    .schedule div{background:#d8edf8;border:1px solid #88b8ce;border-radius:2px}
    .schedule div:nth-child(4n+1){background:#a7d8ee}
    @media(max-width:480px){
      .phone{width:100vw;height:100vh;min-height:0}.header{height:88px}
      .title{font-size:20px}.bubble{font-size:17px}.chat{padding-inline:12px}
    }
  </style>
</head>
<body>
  <main class="phone">
    <header class="header">
      <div class="back">‹</div>
      <div class="heading">
        <div class="title">Thảo Mộc Coffee_Group</div>
        <div class="members">9 thành viên</div>
      </div>
      <div class="actions" aria-hidden="true">
        <img class="icon" src="assets/brand/zalo/phone3.png" alt=""/>
        <img class="icon icon-video" src="assets/brand/zalo/video.png" alt=""/>
        <img class="icon icon-menu" src="assets/brand/zalo/menu.png" alt=""/>
      </div>
    </header>

    <section class="chat">
      <div class="row">
        <div class="avatar"><img src="avatarthreads/691776211_18092243654076179_1348958173927704985_n.jpg" alt=""/></div>
        <div class="message">
          <div class="bubble image-bubble">
            <div class="schedule">
              <div></div><div></div><div></div><div></div>
              <div></div><div></div><div></div><div></div>
              <div></div><div></div><div></div><div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="avatar"><img src="avatarthreads/691776211_18092243654076179_1348958173927704985_n.jpg" alt=""/></div>
        <div class="message">
          <div class="bubble">Lịch làm của các em nhé.</div>
        </div>
      </div>

      <div class="row">
        <div class="avatar"><img src="avatarthreads/573323465_1219825463302212_7278921664109726296_n.jpeg" alt=""/></div>
        <div class="message">
          <div class="bubble">
            <div class="sender">Thái Phương Thảo</div>
            Các em gửi lịch học tuần sau qua chị nhé <span class="mention">@All</span>
            <div class="reply">Trả lời</div>
          </div>
        </div>
      </div>

      <div class="row mine">
        <div class="avatar"><img src="avatarthreads/742208514_17941413951252799_2376814528070332172_n.jpg" alt=""/></div>
        <div class="message">
          <div class="bubble">
            <div class="sender">Thảo Mộc Coffee</div>
            Dạ em chốt lịch của chị Kiều 19h chủ nhật ngày 9/8, chị đã cọc 200k ạ.
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
